<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>html</title>
        <style>
div.aaa img{
    background-color: red;
    width: 200px;
    height: 100px;

    transition: width 3s,
                height 3s,
                background-color 3s,
                transform 3s;
}

div.aaa img:hover{
    width: 300px;
    height: 200px;
    background-color: blue;

    transform: rotate(30deg)
               scale(1.2, 1.2)
               translate(80px, 0px);
}
        </style>
    </head>
    <body>
        <div class="aaa">
            <img src="./image/cat.png" alt="cat">
            <img src="./image/dog.png" alt="dog">
        </div>
    </body>
</html>
