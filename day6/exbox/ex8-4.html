<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>box2</title>
        <style>
.box1{
    border-width: 2px;
    border-style: solid;
}

.box2{
    border-width: thick thin;
    border-style: solid;
}

.box3{
    border-width: thick thin thin;
    border-style: solid;
}

.box4{
    border-width: 10px 5px 5px 10px;
    border-style: solid;
}
div{
    width: 200px;
    height: 100px;
    margin-bottom: 10px;
}
        </style>
    </head>
    <body>
        <div class="box1"></div>
        <div class="box2"></div>
        <div class="box3"></div>
        <div class="box4"></div>

    </body>
</html>
