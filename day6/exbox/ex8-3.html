<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>box</title>
        <style>
            .box1{
                border-style: solid;
                margin-bottom: 5px;
            }
            .box2{
                border-style: dotted;
                margin-bottom: 5px;
            }
            .box3{
                border-style: dashed;
            }
        </style>
    </head>
    <body>
        <div class="box1">실선</div>
        <div class="box2">점선</div>
        <div class="box3">짧은 직선</div>
    </body>
</html>
