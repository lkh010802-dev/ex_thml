<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>op</title>

    <script>
        //1.산술연산자
        document.write(10+4);
        document.write('<br>');

        document.write(10*4);
        document.write('<br>');

        document.write(10/4);
        document.write('<br>');

        //파이썬에 있던 몫을 구하는 연산자.  //는 없고 %만 있다.
        //js에서 몫을 구하고 싶다면 나눗셈의 결과에서 소수점 아래를 날림 된다.
        document.write(parseInt(10/3));
        document.write('<br>');
        document.write(10%3);
        document.write('<br>');

        //0나눗셈(파이썬에서 에러! js에서는'무한대'출력)
        document.write(10/0);
        document.write('<br>');

        //2.비교 연산자
        var a= 10;
        document.write(a>5);
        document.write('<br>');
        document.write(a<5);
        document.write('<br>');
        document.write(a>=5);
        document.write('<br>');
        document.write(a<=5);
        document.write('<br>');
        document.write(a==5);
        document.write('<br>');
        document.write(a!=5);
        document.write('<br>');

        //특이함 비교연사
        var b= 10;
        var c= "10";
        var d= 10.0;
        //js == 연산자는 자료형을 구분하지 않고 생김새가 같으면 ok
        document.write(b==c);
        document.write('<br>');
        document.write(b==d);
        document.write('<br>');

        // 자료형과 값 모두를 비교해주는 연산자 ===
        document.write(b===c);
        document.write('<br>');
        
        document.write(b===d);
        document.write('<br>'); //정수,시수 모두 numebr타입이라 진실
        document.write('<hr>');

        //파이썬과 다른 비교연산 규칙.
        age=35
        document.write(20<age<30);//한번에 하나씩 계산하기 때문에 진실로 나온다.
        document.write('<br>');
        //js에서는 0, ''', undefined를 제외한 모든 값을 진실로 인식 1로 인식 false만 0으로 인식한다.
        document.write(true == 1);
        document.write('<br>');
        document.write(false ==0);
        document.write('<br>');
        document.write(true<10);
        document.write('<hr>');

        //그래서 js애서는 비교연산을 연달아 작성하지 않는다.
        // 그럼 2갸 이상의 조건을 비교해야 한다면 and(&&), or(||)같은 논리연산자를 사용한다.

        //3. 논리연산자[and(&&),or(||),not(!)]
        var age = 9;
        var heught = 150;
        //놀이동산 이용제한 조건 비교(나이가 10상이상 , 키가 140이상)
        if(age>=10 && heught>=140){
            document.write('놀이동산 타라')
        }else{
            document.write('타지마라')
        }
        document.write('<br>');
        // 두 조건중 하나라도 충족한다면
        if(age>=10 || heught>=140){
            document.write('타라')
        }
        document.write('<br>');

        //성인이 아니면? 이라는 조건식을 문법적으로 쓸 때
        if(!(age>=20)){
            document.write('no adult<br>')
        }
        document.write('<br>');

        //4.비트 연산자 많이 사용하지 않으니 알아만 두기
        // 숫자 연산을 2진수로 변환하여 각 비트자리끼리 연산(and(&), or(|), xor(^),.....)
        document.write(10 & 2);
        document.write('<br>');
        document.write(10|2);
        document.write('<br>');
        document.write(10^2);
        document.write('<br>');

        //시프트 연산자- 비트의 자리를 이동
        document.write(10<<2);
        document.write('<br>');
        document.write(10>>2);
        document.write('<br>');

        //>>시프트 연산자는 부호자리는 움직이지 않으나 >>>연산자는 부호자리도 움직여서 부로가 변경 가능
        // 첫번째 비트자ㅣ가 부호를  표시하는 자리이면, 0이면 양수, 1이면 음수
        var g = -16;
        document.write(g>>2); //부호가 그대로여서 음수
        document.write('<br>');
        document.write(g>>>2); //부호가 움직여서 양수가 되고 큰 수가 된다.
        document.write('<br>');

        //.write()출력기능에 너무 큰 수치값을 쓰면 알아서 지수 표현식으로 출력하기도 한다..
        document.write(2345678912341234123412341234123413421234);
        document.write('<br>');
        document.write(Number.MAX_VALUE);// 표현할 수 있는 최대 값
        document.write('<hr>');

        //5. 복합 대입연산다(산술+대입)

        var num = 10;
        document.write(num + '<br>');
        num = num+1;
        document.write(num+'<br>');

        num+=1;
        document.write(num+'<br>');

        num+=3;
        document.write(num+'<br>');
        
        num/=3;
        document.write(num+'<br>');
        document.write('<hr>');

        //6.증감 연산자(변수값의 1증가 또는 감소를 간결하게 해주는 연산자)
        num=10;
        num+=1;
        document.write(num+'<br>');
        num++;
        document.write(num+'<br>');
        //무조건 1증가 ++
        num--;
        document.write(num+'<br>');
        //1감소
        // 연산자의 순서는 약간의 차이가 있다.
        // num++: 선 출력 후 연산
        // ++num: 선 연산 후 출력
        num=10;
        document.write(num++);
        document.write('<br>');
        document.write(num);
        document.write('<br>');

        num=10;
        document.write(++num);
        document.write('<br>');
        document.write(num);
        document.write('<br>');
        document.write('<hr>');

        //7. 삼항 연산자(파이썬과 문법이나 작성위치가 살짝 다르다)
        var x= 5;
        var y= (x>10)?'A':'B';
        document.write(y);
        document.write('<br>');

        //응용점수에 따른 학점계산
        var score= 75;
        var grade= (score>=90)?'A':(score>=80)?'B':(score>=70)?'C':(score>=60)?'D':'F';
        document.write(grade+'학점');
        document.write('<br>');
        document.write('<hr>');

        //연산할때 추가로 알아야할 형변환 기능(함수)
        //프로그램에서 사용자의 입력은 무조건 문자열로 입력된다.
        //사용자 입력은 html의 <input>요소를 사용해야 하지만 간단하게 다이얼로그를 보여주고 입력받기

        var age= prompt('나이를 입력 하세요');
        document.write('나이보다 3살 위 :' + (age+3));
        document.write('<br>');
        //문자열을 수치형으로 변환하는 기능
        age= parseInt(age);
        document.write('나이보다 3살 위: '+ (age+3));
        document.write('<br>');
        // 변환 가능한 문자열 모양이어야 한다.
        document.write(parseInt("488")+'<br>');  //그대로
        document.write(parseInt("ㅁㅁㅁ")+'<br>'); //글자니까 NaN
        document.write(parseInt("3.14")+'<br>');  //Float을 안쓰니 정수 부분의 3만 나온다.
        document.write(parseFloat("3.14")+'<br>');
        

    </script>
</head>
<body>
    
</body>
</html>
