    <!-- 2.DOM tree의 계층구조 관계를 이용하여 특정 요소를 찾아서 제어가 가능하다. -->
    <p>this is pargraph</p>
    <button onclick="ddd(this)">스타일 변경</button>
    <script>
        function ddd(e){//e는 버튼의 요소
            //버튼이 클릭되면 버튼의 바로 앞p요소를 찾아서 그 스타일 변경
            var p= e.previousElementSibling;
            p.style.color='red';
        }
    </script>

    <hr>
    <!-- DOM tree이해하고 있으면 노드간의 관계를 이용하여 요소들의 선택을 쉽게 할 수 있다. -->
    <!-- HTML요소를 찾는 가장 쉬운 방법은 CSS언어의 선택자를 이용하는 것이다. -->
    <!-- js으 객체를 부모/지식등의 요소선택기능을 제공하지 않았다. -->
    <!-- 그래서 document의 기능으로 CSS선택자를 사용할 수 있도록 개선이 되었다. -->
    <div id="wap">
        <p>good</p>
        <h4>aaa</h4>
        <h4>bbb</h4>
        <h4>ccc</h4>
    </div>
    <script>
        var p= document.querySelector('#wap p');//자손 선택자
        p.style.color='bule';

        var h4s= document.querySelectorAll('#wap>h4');//자식 선택자
        h4s[0].style.color= 'red';
        h4s[2].style.color= 'green';
        h4s[1].style.color= 'red';
