<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>array</title>

    <!-- 내부 작성 -->
    <script>
        //이 영역 안에서 js언어의 문법체계를 따른다.

        //배열 array: 여러개의 데이터를 하나의 변수로 관리하기위한 문법(자료구조)
        //파이썬과는 달리 리스트, 튜플, 딕셔너리등으로 구분되어 있지 않고 모두 배열로 관리된다.

        //js에서 배열을 만드는 2가지 생성 방법
        //1. 리터럴 배열(literal array)
        let aaa= [10,20,30];
        document.write(aaa+'<br>'); //배열의 요소값들을, 구분으로 문자열로 준다.
        document.write(aaa[0]+'<br>');
        document.write(aaa[1]+'<br>');
        document.write(aaa[2]+'<br>');
        document.write(aaa[3]+'<br>'); //예외발생(error)가 아니라 . undefined로 출력한다.
        document.write('<hr>');

        //요소글의 자료형이 달라도 된다.
        let bbb = [10,'sam',true];
        document.write(bbb[0]+'<br>');
        document.write(bbb[1]+'<br>');
        document.write(bbb[2]+'<br>');
        

        //배열의 요소개수를 확인할 수 있다. 새로운 인덱스 번호 사이의 요소는 자동생성
        document.write('요소개수: '+bbb.length+'<br>');

        //파이썬의 리스트처럼 새로운 요소를 추가할 수 있다.
        bbb[5]=100;
        document.write(bbb[3]+'<br>');
        document.write(bbb[4]+'<br>');
        document.write(bbb[5]+'<br>');
        document.write('요소개수: '+bbb.length+'<br>');

        //요소의 값들을 반복문으로 접근하기
        for(let i=0; i<bbb.length; i++){
            document.write(bbb[i]+'<br>');
        }
        


        //2. array 객체로 배열 생성
        let ccc= new Array(10,20,30);
        for(let i=0; i<ccc.length; i++){
            document.write(ccc[i]+'<br>');
        }
        document.write('<br>');

        //대량의 데이터 요소를 순차적으로 접근할 떄 사용하는 for in문법이 있다. 파이썬과는 다르게 요소값이 아니라 Index값이 온다.
        for(let e in ccc){
            document.write(ccc[e]+'<br>');
        }
        document.write('<br>');

        //빈 배열객체를 생성한 후에 요소값들을 추가
        ddd = new Array();
        document.write('요소개수: '+ ddd.length + '<br>');

        ddd[0]=100;
        ddd[1]='app';
        ddd[2]=5>3;
        ddd[3]=new Date();
        for(let i=0; i<ddd.length; i++){
            document.write(ddd[i]+'<br>');
        }
        document.write('<hr>');

        //파이썬의 딕셔너리처럼 인덱스 번호 대신에 문자열 키워드로 요소를 구별하는 배열이 존재한다. 이를 연관배열이라 부른다.
        //연관배열: 키로 인덱스를 대신하는 배열이다.

        let eee = new Array();
        eee['name']= 'sem';
        eee['age']= 20;
        eee['address']= 'kkk';

        document.write('이름: '+eee['name']+'<br>');
        document.write('나이: '+eee['age']+'<br>');
        document.write('주소: '+eee['address']+'<br>');

        //리터럴 배열로도 연관배열 가능
        fff= []; //빈배열
        fff['aaa']=100;
        fff['bbb']=200;

        document.write(fff+'<br>');
        document.write(fff['aaa']+'<br>');
        document.write(fff['bbb']+'<br>');

        document.write('<hr>');

        //2차원 배열(1차원 배열을 여러개 가진 배열)
        let ggg= new Array();
        let a1=[10,20,30];
        let a2=['aa','bb','cc'];
        let a3=[true,true,false,false];

        ggg[0]= a1;
        ggg[1]= a2;
        ggg[2]= a3;

        document.write(ggg[0]+'<br>');
        document.write(ggg[0][0]+'<br>');
        document.write(ggg[0][1]+'<br>');
        document.write(ggg[0][2]+'<br>');
        document.write('<br>');
        
        document.write(ggg[1]+'<br>');
        document.write(ggg[1][0]+'<br>');
        document.write(ggg[1][1]+'<br>');
        document.write(ggg[1][2]+'<br>');
        document.write('<br>');

        document.write(ggg[2]+'<br>');
        document.write(ggg[2][0]+'<br>');
        document.write(ggg[2][1]+'<br>');
        document.write(ggg[2][2]+'<br>');
        document.write('<br>');

        for(let i=0; i<ggg.length; i++){
            for(let n=0; n<ggg[i].length; n++){
                document.write(ggg[i][n]+'<br>');
            }
        }

    </script>
</head>
<body>
    
</body>
</html>
