<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>excetion</title>

    <script>
        document.write('예외처리합니다.<br><br>');
        
        //js는 에러가 발샹하면 그 자리에서 코드실행이 멈춘다.
        

        //예외처리문 try.. catch
        // 
        try{
            ale('aaa'); //에외발생;    
        }catch(error){
            document.write('예외 발생<br>');
        }
        document.write('<hr>');
        //예외가 발생하든 안하든 무조건 실행 finally
        try{
            aaa(); //에외발생;    
        }catch(error){
            document.write('예외 발생<br>'+error+'<br>');
        }finally{
            document.write('여긴 그냥 실행<br>');
        }
        //finally는 네트워크 연결 작업같은 곳에서 전송 셩공여부와 상관없이
        //서버 연결을 종료하는 코드등을 작성하는 목적으로 사용한다.

        document.write('<hr>');

        //예외가 아닌데 억지로 예외로 만들어서 던지는 문법 throw 파이썬튼 raise
        try{
            var a=10;
            var b=-20;
            var c= a+b;

            if(c<0){
                throw "음수금지"; //예외가 발생
            }

            document.write('결과: '+c+'<br>');
        }catch(e){
            document.write('에러<br>')
        }
        document.write('script 종료');
    </script>
</head>
<body>
    
</body>
</html>
