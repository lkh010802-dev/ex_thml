<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Array object</title>
    
    <script>
        //5. Array

        //이미 배열수업에 배열다루는 것은 배웠음..
        var aaa= new Array(10,20,30);
        document.write( typeof(aaa) +'<br>');// object

        //배열 객체가 가지고 있는 유용한기능(function함수 method)
        //배열요소의 값들을, 구분자로 하여 하나의 문자열로 만들어 주는 기능
        document.write(aaa.toString()+'<br>');
        //toString()을 직접 쓰는 경우는 별로 없다. 배열 참조변수를 출력하면 자동으로 해준다.
        document.write(aaa+'<br>');

        //다른 배열을 이어 붙여서 새로운 배열을 만들어 주는 기능
        var bbb=[4,5,6];
        var ccc= aaa.concat(bbb);
        document.write(ccc+'<br>');
        //원본은 유지
        document.write(aaa+'<br>');
        //파이썬의 리스트처럼+ 결합연산자는 없다. 단 에러가 안난다. 각 배열의 문자열로 변환 후 문자열의 결합으로 된다.
        var ddd= aaa+bbb;
        document.write(ddd+'<br>');
        document.write(typeof(ddd)+'<br>');
        document.write('<hr>');

        //indexof -특정값이 몇번 위치에 있는지? 
        document.write(aaa.indexOf(30)+'<br>');
        document.write(aaa.indexOf(55)+'<br>');
        document.write(aaa.indexOf(10,1)+'<br>');//1번방 이후부터10찾기
 
        // push,pop[stack 구조]
        var stack=[1,2,3,4,5,6,7];
        stack.push(10);
        document.write(stack+'<br>');

        //첫번쨰 요소를 빼오기[실제 배열에 변화가 생긴다.]
        var e= stack.pop();
        document.write(e+'<br>');
        document.write(stack+'<br>');


        // push,shift [queue 구조]
        var queue= [1,2,3,4,5];
        queue.push(10);
        document.write(queue+'<br>');

        var e= queue.shift(); //첫번쨰 요소 빼오기
        document.write(e+'<br>');
        document.write(queue+'<br>');
        document.write('<hr>');

        // revers 배열의 저장 순서를 뒤집기(원본이 변경된다.)
        var aaa= [10,20,30,40,50];
        aaa.reverse();
        document.write(aaa+'<br>');

        //slice 배열의 일부분을 잘라서 새로운 배열로 리턴한다.(원본 불변)
        var aaa= [10,20,30,40,50,60,70,80,90];
        var bbb= aaa.slice(3);//3번부터 잘라서 새로운 배열로 리턴
        document.write(aaa+'<br>');
        document.write(bbb+'<br>');

        var ccc= aaa.slice(3,6);
        document.write(ccc+'<hr>');
        
        //join 배열의 여소를 특정문자를 구분자로 하여 하나의 문자열로 리턴해준다. string의 split과 다르다.
        var aaa= ['sam','robin','hong'];
        var bbb= aaa.join("&"); //"sam&robin&hong"
        document.write(bbb+'<br>');
        document.write('<hr>');

        //sort 정렬(원본이 변경된다.)
        var aaa=[3,4,5,6,1,7];
        aaa.sort();
        document.write(aaa+'<br>');

        //두 자리 이상의 숫자를 정렬하면
        var aaa= [49,233,77,84,22,111];
        aaa.sort(); //숫자를 자리수끼리 비교하면서 순위를 정한다.
        document.write(aaa+'<br>');

        //그래서 정렬을 하는 기준을 결정하는 함수를 이용한다.[정렬기준함수]
        aaa.sort(function(a,b){
            return a-b;
        });
        document.write(aaa+'<br>');

        aaa.sort(function(a,b){
            return b-a;
        });
        document.write(aaa+'<br>');
        document.write('<hr>');

        // filter 필터지정함수를 활용(필터의 기준을 정하는 것임)
        var scores= [90,75,54,53,57,87,97,13,35];
        //80점 이상의 점수만 뽑아서 새로운 배열로 만들어 내기(필터링)
        var good_scores= scores.filter(function(e,index,array){
            //필터 조건 이 조건이 true인 요소들만 새 배열에 포함된다.
            //return e>=80;
            return e>=80 && index>3; //80점 이상이면서 요소위치번호가 3번보다 큰것들 
        });

        document.write(good_scores+'<br>');
        document.write('<hr>');

        //ECMAScript5버전에서 새로 추가된 기능들
        var aaa= [10,20,30,40,50];

        //각각의 배열요소들에 접근하는 반복기능을 제공
        aaa.forEach(function(e,index,array){
            document.write(e+":"+index+"-"+array.length+'<br>');
        });
        document.write('<hr>');

        //forEach처럼 각 요소개수만큼 전달한 함수를 실행해주며 리턴을 통해 새로운 배열을 만들어준다.
        //aaa배열의 요소들마다 x2를 한 새로운 배열을 만들기
        var bbb= aaa.map(function(e,index,array){
            return e*2;
        });
        document.write(bbb+'<br>');
        //map()은 원본배열을 가지고 조작하여 새로윤 배열을 만들때 매우 유용, 많이 사용한다.

        // .map()에 전달한 함수의 파라미터 개수의 최대3개이며 순서가 정해져 있다.
        //변수명을 바꿔도 되며 필요한 것만 사용가능
        var bbb= aaa.map(function(e){
            return e*2;
        });
        document.write(bbb+'<br>');



    </script>
</head>
<body>    
    
</body>
</html>
