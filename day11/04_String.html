<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>]string</title>
    <script>
        //String생성자 함수- 문자열처리에 관련돤 여러 기능들 설계도
        //기초타입 string과 구별

        var a='sam';
        var b= new String('sam');

        document.write(typeof(a)+'<br>');
        document.write(typeof(b)+'<br>');
        document.write((a===b)+'<hr>');

        //string의 유용한 변수와 기능들(function-함수 메소드)
        var s= 'Hello world'; //자동string객체로 wrapping

        // 글자수를 가지고 있는 멤버변수(속성)
        document.write(s.length+'<br>');

        //대소문자 변환 기능
        document.write(s.toUpperCase()+'<br>');// 단 원본은 안바뀐다.
        document.write(s.toLowerCase()+'<br>');
        document.write(s+'<br>');

        //글씨 결합하기
        document.write(s.concat('si')+'<br>');// 원본유지
        //문자열의 결합은 매우 많이 사용하지만 concat()은 많이 안쓴다.
        //문자열의 +결합연사자를 더 많이 사용한다.
        document.write(s+'si'+'<br>');

        //특정 문자가 있는 위치번호(index번호 0,1,2)얻어오기
        document.write(s.indexOf('world')+'<br>');//해당 문자의 첫 글자 자리번호
        document.write(s.indexOf('sss') + '<br>'); //못찾으면 -1
        //검색할때 대소문자 구별
        document.write(s.indexOf('worlD')+'<br>');//-1
        //댇소문자 구별없이 검색하고 싶다면 옵션추가
        document.write(s.indexOf(/worlD/i)+'<br>');//슬래스로 문자열을쓰는 방식

        //문자열 안에 원하는 문자를 찾아서 검색하여 추출(문자 탐색 match)
        var str='Hello world! nice nice nice nice nice nice nice nice nice Nice 뭐 뭘봐요 진짜'
        var word= str.match('Hello');
        document.write('검색글자: '+word+'<br>');

        var word= str.match('good');
        document.write('검색글자: '+word+'<br>');

        //대소문자를 구분하여 null이 나온다.
        var word= str.match('hello'); 
        document.write('검색글자: '+word+'<br>');

        var word= str.match('Hello');
        document.write('검색글자: '+word+'<br>');
        document.write(str.match(/hello/i)+'<br>');

        //여러개의 같은 문자가 있을 때 찾아지는지
        var words= str.match(/nice/);
        document.write('찾은 글자: '+words+'<br>');

        //옵션추가
        var words= str.match(/nice/g);
        document.write('찾은 글자: '+words+'<br>');

        //대소문자 구별없이 모든 문자들 탐색하려면 옵션 2개를 모두 사용한다.
        var words= str.match(/nice/ig);
        document.write('찾은 글자: '+words+'<br>');


        //문자 바꿔치기 replace
        var s='Hello world';
        document.write(s.replace('world','wed')+'<br>');//원본은 그대로
        document.write(s.replace('nice','wed')+'<br>');//없는 글자를 바꾸려하면 원본ㄴ출력

        document.write(s.replace('worlD', 'wed')+'<br>');//flase 안바뀜
        document.write(s.replace(/worlD/i, 'wed')+'<br>');

        //여러개의 단어를 동시에 모두 바꾸려면
        var str= 'hello world. nice world, good world, bad world'
        document.write(str.replace('world','AI')+'<br>');
        document.write(str.replace(/world/ig, 'AI')+'<br>');

        //문자열 사이 사이에 있는 모든 공백문자를 없엘때도 활용가능
        var result= str.replace(/ /ig,'');//공백문자를 빈문자열로 바꾸기
        document.write(result+'<hr>');

        //문자열을 특정 문자기준으로 잘라서 배열로 리턴해주는 기능(csv차일 분석에 많이 활용된다.)
        var s="1,2,3,4,5";
        var aaa=s.split(',');
        var aaa= ['1','2','3','4','5']; //,를 기준으로 짜르기
        document.write('요소의 개수:'+ aaa.length+'<br>');
        document.write(aaa[0]+'<br>');
        document.write(aaa[1]+'<br>');
        document.write(aaa[2]+'<br>');
        document.write(aaa[3]+'<br>');
        document.write(aaa[4]+'<br>');

    </script>
</head>
<body>
    
</body>
</html>
