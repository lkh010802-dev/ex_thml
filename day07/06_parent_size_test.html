<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부모요소 사이즈</title>
    <style>
        *{border: 1px dotted red;}
    </style>

</head>
<body>
    <!-- 부모요소 box의 height은 언제나 자식 요소 box높이를 감싸지 않는다. -->
    <!-- 블럭요소안에 다른 블록요소가 있다면 부모가 자식을 온전히 감싼다. -->
    <div style="border: 1px dotted blue;">
        <p style="padding: 20px;">Hello</p>
    </div>

    <!-- 블럭요소안에 인라인요소가 있다면 부모가 자식을 온전히 감싸지 않는다.(마진과 패딩은 제외) -->
    <div style="background-color: aqua; border: 1px dotted blue;">
        <a href="" style="padding: 10px; margin: 10px;">naver</a>
        <!-- 인라인블럭은 적용이 된다. -->
        <input type="text" style="padding: 10px; margin: 10px;">
    </div>
</body>
</html>
