<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>직방 로그인</title>
    <link rel="stylesheet" href="bang.css">
</head>

<body>

<div class="container">

    <header class="header">
        <img src="./imgs_company/home.png" alt="직방 로고">
        <h1>직방</h1>
    </header>

    <section class="login-description">
        <p>간편하게 로그인하고</p>
        <p class="highlight">다양한 서비스를 이용하세요.</p>
    </section>

    <nav class="login-menu">
        <ul class="login-list">

            <li>
                <a href="#" class="login-btn kakao">
                    <img src="./imgs_company/free-icon-kakao-talk-3991999.png" alt="">
                    <span>카카오톡으로 시작</span>
                </a>
            </li>

            <li>
                <a href="#" class="login-btn">
                    <img src="./imgs_company/free-icon-google-300221.png" alt="">
                    <span>Google로 시작</span>
                </a>
            </li>

            <li>
                <a href="#" class="login-btn">
                    <img src="./imgs_company/free-icon-apple-black-fruit-shape-49819.png" alt="">
                    <span>Apple로 등록</span>
                </a>
            </li>

            <li>
                <a href="#" class="login-btn">
                    <img src="./imgs_company/free-icon-facebook-2111398.png" alt="">
                    <span>Facebook로 시작</span>
                </a>
            </li>

        </ul>
    </nav>

    <footer class="footer">
        <a href="#">이메일로 로그인하기</a>
    </footer>

</div>

</body>
</html>
